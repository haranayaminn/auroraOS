<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152d">
  <meta name="description" content="自分のアプリをまとめて起動するAuroraOS">
  <title>AuroraOS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>AuroraOS</span></div>
      <div class="top-right"><span id="dateText"></span><span id="clock">--:--</span><button id="settingsBtn" class="icon-btn" aria-label="設定">⚙</button></div>
    </header>
    <main>
      <section class="welcome">
        <p class="eyebrow">YOUR PERSONAL SPACE</p>
        <h1>おかえりなさい。</h1>
        <p class="sub">アプリも、アイデアも、ここから。</p>
        <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="アプリを検索…" autocomplete="off"></label>
      </section>
      <section class="section-head"><h2>マイアプリ</h2><button id="addBtn" class="primary">＋ アプリを追加</button></section>
      <section id="appGrid" class="app-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty hidden">アプリが見つかりません。別の言葉で検索してみてね。</p>
      <section class="hint"><span class="hint-icon">✧</span><div><strong>ここを自分仕様に。</strong><p>「アプリを追加」から、公開済みの自作Webアプリを登録できます。</p></div></section>
      <footer>AURO​RAOS · A home for your creations</footer>
    </main>
  </div>

  <dialog id="appDialog">
    <form id="appForm" method="dialog">
      <div class="dialog-head"><h2 id="dialogTitle">アプリを追加</h2><button type="button" class="icon-btn" id="closeDialog" aria-label="閉じる">✕</button></div>
      <label>アプリ名<input id="appName" required maxlength="48" placeholder="例：Aurora Music"></label>
      <label>アプリのURL<input id="appUrl" type="url" required placeholder="https://example.vercel.app"></label>
      <label>アイコン
        <select id="appIcon"><option value="🎵">🎵 音楽</option><option value="🌐">🌐 ブラウザ・Web</option><option value="💻">💻 プログラミング</option><option value="🗂️">🗂️ ファイル</option><option value="💬">💬 チャット</option><option value="🖼️">🖼️ 画像</option><option value="🚀">🚀 その他</option></select>
      </label>
      <p class="form-note">URLは https:// から入力してね。登録内容はこのブラウザ内に保存されます。</p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelBtn">キャンセル</button><button type="submit" class="primary">保存する</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-head"><h2>設定</h2><button type="button" class="icon-btn" id="closeSettings" aria-label="閉じる">✕</button></div>
      <label>表示名<input id="displayName" maxlength="32" placeholder="おかえりなさい"></label>
      <label>アクセントカラー<select id="accentSelect"><option value="blue">オーロラブルー</option><option value="purple">オーロラパープル</option><option value="green">オーロラグリーン</option></select></label>
      <div class="dialog-actions"><button type="button" class="secondary" id="resetBtn">初期アプリに戻す</button><button type="submit" class="primary">適用</button></div>
    </form>
  </dialog>
  <script src="./app.js"></script>
</body>
</html>
